<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bill Generator - Warehouse Ops</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container no-print">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Invoice Generator</h2>
                <p>Warehouse Ops Internal</p>
            </div>
            
            <form id="invoice-form">
                <section class="form-section">
                    <h3>Invoice Style</h3>
                    <div class="input-group">
                        <label>Select Template</label>
                        <select id="template-selector">
                            <option value="template-classic">Classic (Default)</option>
                            <option value="template-modern">Modern Edge</option>
                            <option value="template-minimal">Minimalist Centered</option>
                            <option value="template-corporate">Corporate Trust</option>
                            <option value="template-elegant">Elegant Luxury</option>
                            <option value="template-tech">Tech Startup</option>
                            <option value="template-eco">Eco Green</option>
                            <option value="template-executive">Executive Ledger</option>
                            <option value="template-vintage">Warm Vintage</option>
                            <option value="template-bold">Bold Sidebar</option>
                            <option value="template-twotone">Two-Tone</option>
                            <option value="template-retail">Retail Receipt</option>
                            <option value="template-pastel">Soft Pastel</option>
                        </select>
                    </div>
                </section>

                <section class="form-section">
                    <h3>Business Details</h3>
                    <div class="input-group">
                        <label>Business Name</label>
                        <input type="text" id="biz-name" value="Nobel Air Conditioner" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label>Address</label>
                        <input type="text" id="biz-address" value="10-5-300/23/3/A, Ahmed Nagar Road, Banjara Hills, Hyderabad, Telangana - 500028" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label>Contact Info</label>
                        <input type="text" id="biz-contact" value="" autocomplete="off" placeholder="Phone or Email">
                    </div>
                </section>

                <section class="form-section">
                    <h3>Customer Details</h3>
                    <div class="input-group">
                        <label>Customer Name</label>
                        <input type="text" id="cust-name" placeholder="E.g. Acme Corp" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label>Customer Address</label>
                        <input type="text" id="cust-address" placeholder="E.g. 456 Delivery Rd, NJ" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label>Invoice Date</label>
                        <input type="date" id="invoice-date">
                    </div>
                    <div class="input-group">
                        <label>Invoice Number</label>
                        <input type="text" id="invoice-number" placeholder="E.g. INV-2026-001" autocomplete="off">
                    </div>
                </section>

                <section class="form-section items-section">
                    <div class="section-header">
                        <h3>Line Items</h3>
                        <button type="button" id="add-item-btn" class="secondary-btn">+ Add Item</button>
                    </div>
                    <div id="items-list">
                        <!-- Items will be injected here via JS -->
                    </div>
                </section>

                <div class="actions">
                    <button type="button" id="print-btn" class="primary-btn">Generate PDF</button>
                </div>
            </form>
        </aside>

        <main class="preview-area">
            <div class="preview-container">
                <div class="invoice-paper" id="invoice-preview">
                    <!-- The generated invoice HTML will be updated here by JS -->
                </div>
            </div>
        </main>
    </div>
    
    <!-- Printable version that is only shown during print -->
    <div class="print-container" id="print-container">
        <!-- Exact clone of invoice-preview will be injected here during print -->
    </div>

    <script src="app.js"></script>
</body>
</html>
